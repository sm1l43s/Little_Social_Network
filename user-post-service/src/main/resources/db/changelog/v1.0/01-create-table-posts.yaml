databaseChangeLog:
  - changeSet:
      id: create-table-posts
      comment: Create table posts
      preConditions:
        - not:
            - tableExists:
                tableName: posts
      author: Artem
      changes:
        - createTable:
            tableName: posts
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                  autoIncrement: true
              - column:
                  name: user_id
                  type: char(36)
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: clob
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: varchar(2083)
              - column:
                  name: date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: time
                  type: time
                  constraints:
                    nullable: false

