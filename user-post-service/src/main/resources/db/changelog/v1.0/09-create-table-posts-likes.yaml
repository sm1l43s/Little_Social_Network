databaseChangeLog:
  - changeSet:
      id: create-table-posts-likes
      comment: Create table posts_likes
      preConditions:
        - not:
            - tableExists:
                tableName: posts_likes
      author: Artem
      changes:
        - createTable:
            tableName: posts_likes
            columns:
              - column:
                  name: user_id
                  type: char(36)
              - column:
                  name: post_id
                  type: bigint
          addPrimaryKey:
            tableName: posts_likes
            columnNames: user_id, post_id
          addForeignKeyConstraint:
            baseTableName: posts_likes
            baseColumnNames: post_id
            constraintName: fk_posts_likes_posts
            referencedTableName: posts
            referencedColumnNames: id
            onDelete: cascade