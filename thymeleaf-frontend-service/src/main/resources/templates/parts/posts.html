<div th:fragment="posts">
    <th:block th:each="post : ${posts}">
        <div class="card gedf-card">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="mr-2">
                            <th:block>
                                <img class="rounded-circle img-thumbnail photoBorderForPost" th:src="*{post.userAvatarUrl()}" alt="">
                            </th:block>
                        </div>
                        <div class="ml-2">
                            <a th:href="${post.userId() == authUserInfo.id()} ? '/social-network/user-profile'
                                                                              : '/social-network/user-profile/' + ${post.userId()}">
                                <div class="h5 text-muted" th:text="${post.userLastName()} + ' ' + ${post.userFirstName()}"></div>
                            </a>
                        </div>
                    </div>
                    <th:block th:if="${userInfo} == ${authUserInfo}">
                        <div>
                            <div class="dropdown">
                                <button class="btn btn-link dropdown-toggle" type="button" id="gedf-drop1" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                    <i class="fa fa-ellipsis-h"></i>
                                </button>
                                <div class="dropdown-menu dropdown-menu-right" aria-labelledby="gedf-drop1">
                                    <div class="h6 dropdown-header">Действие</div>
                                    <a class="dropdown-item" th:href="'/social-network/posts/delete-post/' + ${post.id()}">Удалить</a>
                                </div>
                            </div>
                        </div>
                    </th:block>
                </div>

            </div>
            <div class="card-body">
                <div class="text-muted h7 mb-2">
                                    <span>
                                        <i class="far fa-clock"></i>
                                        <span th:text="${post.time()}"></span>
                                    </span>
                    <span class="ml-2">
                                        <i class="far fa-calendar-alt"></i>
                                        <span th:text="${post.date()}"></span>
                                    </span>
                </div>
                <th:block th:if="${post.imageUrl() != null}">
                    <img class="img-thumbnail shadow-sm img-fluid mb-3" th:src="*{post.imageUrl()}" alt="">
                </th:block>
                <p class="card-text" th:text="${post.message()}"></p>
            </div>
            <div class="card-footer">
                <a href="" th:id="${post.id()}" th:name="${post.id()}" class="card-link likes" th:value="${post.userIdsWhoLiked().contains(authUserInfo.id())}">
                    <span  th:text="${post.getLikesCount()}"></span> <i class="far fa-heart"></i>
                </a>
                <a data-toggle="collapse" th:href="'#collapseExample' + ${post.id()}" aria-expanded="false" aria-controls="collapseExample" class="card-link">
                    <span th:id="'totalComments-' + ${post.id()}" th:text="${post.getCommentsCount()}"></span> <i class="far fa-comments"></i>
                </a>
            </div>
            <div class="collapse" th:id="'collapseExample' + ${post.id()}">
                <div class="card-header">
                    <form method="post" action="/social-network/posts/add-comment">
                        <div class="form-group row justify-content-end">
                            <textarea name="comment" cols="20" rows="1" class="form-control p-2 form-control-sm" type="text" placeholder="Ваш комментарий"></textarea>
                            <input type="hidden" name="postId" th:value="${post.id()}">
                            <input type="button" class="btnComment btn bnt-sm btn-info mt-2" value="Комментировать">
                        </div>
                    </form>
                </div>
                <div class="card card-body" th:id="'commentContainer-' + ${post.id()}">
                    <th:block th:each="comment : ${post.comments()}">
                        <div th:id="'comment' + ${comment.id()}" class="row mt-2 p-2 rounded-sm border-info">
                            <div class="container-fluid">
                                <div class="row d-flex justify-content-between">
                                    <small>
                                        <strong>
                                            <a th:href="${comment.userId() == authUserInfo.id()} ? '/social-network/user-profile'
                                                                                                 : '/social-network/user-profile/' + ${comment.userId()}"
                                               th:text="${comment.userLastName()} + ' ' + ${comment.userFirstName()}"></a>
                                        </strong>
                                        <small class="text-muted ml-2 font-weight-light" th:text="${comment.date()} + ' в ' + ${comment.time()}"></small>
                                    </small>
                                    <th:block th:if="${userInfo} == ${authUserInfo}">
                                        <small>
                                            <a th:name="'comment' + ${comment.id()}" class="text-danger mt-2 deleteComment">
                                                <i class="far fa-trash-alt"></i>
                                            </a>
                                        </small>
                                    </th:block>
                                </div>
                                <div class="row mt-2 pl-3">
                                    <p th:text="${comment.message()}"></p>
                                </div>
                            </div>
                        </div>
                    </th:block>
                </div>
            </div>
        </div>
    </th:block>
</div>
