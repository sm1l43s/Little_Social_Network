databaseChangeLog:
  - changeSet:
      id: insert-table-users
      comment: Add records to table users
      author: Artem
      changes:
        - loadData:
            file: db/changelog/v1.0/users_data.csv
            separator: ","
            tableName: users
            columns:
              - column:
                  name: id
                  type: char
              - column:
                  name: email
                  type: varchar
              - column:
                  name: password
                  type: varchar
              - column:
                  name: role
                  type: enum
              - column:
                  name: registration_date
                  type: datetime
              - column:
                  name: last_entered
                  type: datetime
