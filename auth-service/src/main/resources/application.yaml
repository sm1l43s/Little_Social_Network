server:
  port: 8081
  servlet:
    context-path: ${CONTEXT_APPLICATION:/auth-service/api/v1}

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:auth_service_db}?${DB_PARAMETERS:serverTimezone=Europe/Moscow&allowMultiQueries=true}
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:pass}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

security:
  jwt:
    key: ${SECRET_KEY:71de977c48b58624648f36090a422127}
    expiration-time: ${EXPIRATION_TIME:86400000} # 1 день
  open-paths:
    POST:
      - ${controller.endpoints.auth.base-path}${controller.endpoints.auth.mappings.sign-in}
      - ${controller.endpoints.auth.base-path}${controller.endpoints.auth.mappings.sign-up}

controller:
  endpoints:
    auth:
      base-path: /auth
      mappings:
        sign-in: /sign-in
        sign-up: /sign-up
        logout: /logout
    auth-user:
      base-path: /user
      mappings:
        change-password: /change-password

service-locations:
  user-profile-service:
      url: ${USER_PROFILE_SERVICE_HOST:http://localhost}:${USER_PROFILE_SERVICE_PORT:8082}${USER_PROFILE_SERVICE_CONTEXT:/user-profile-service/api/v1}
      endpoints:
        user-profiles:
          base-url: ${service-locations.user-profile-service.url}/user-profiles
          mappings:
            update-last-entered: ${service-locations.user-profile-service.endpoints.user-profiles.base-url}/update-last-entered
  user-post-service:
      url: ${USER_POST_SERVICE_HOST:http://localhost}:${USER_POST_SERVICE_PORT:8083}${USER_POST_SERVICE_CONTEXT:/user-post-service/api/v1}
      endpoints:
        posts:
          base-url: ${service-locations.user-profile-service.url}/posts