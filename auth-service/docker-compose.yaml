version: '3.9'

networks:
  app-tier:
    driver: bridge

services:
  mysql:
    image: mysql:9.2.0
    container_name: auth-service-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth_service_db
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
      TZ: Europe/Moscow
    command:
      --log-bin
      --log-bin-trust-function-creators=1
      --default-time-zone='Europe/Moscow'
    ports:
      - "3307:3306"